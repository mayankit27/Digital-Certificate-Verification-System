<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Certificate</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-container">

    <a href="{{ url_for('issuer_dashboard') }}"
       class="back-link">
        ← Back to Dashboard
    </a>


    <div class="form-header">

        <h1>Create Certificate</h1>

        <p>
            Enter the student's achievement details
            to create a new certificate.
        </p>

    </div>


    <form method="POST">


        <!-- Student Details -->

        <div class="form-section">

            <h2>Student Details</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Student Name
                    </label>

                    <input
                        type="text"
                        name="student_name"
                        placeholder="Enter student name"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Student Email
                    </label>

                    <input
                        type="email"
                        name="student_email"
                        placeholder="student@example.com"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        name="mobile"
                        placeholder="Enter mobile number"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Achievement
                    </label>

                    <input
                        type="text"
                        name="achievement"
                        placeholder="e.g. 1st Position"
                        required>

                </div>

            </div>

        </div>


        <!-- Competition Details -->

        <div class="form-section">

            <h2>Competition Details</h2>

            <div class="form-group">

                <label>
                    Competition Name
                </label>

                <input
                    type="text"
                    name="competition_name"
                    placeholder="Enter competition name"
                    required>

            </div>

        </div>


        <!-- Issuer Details -->

        <div class="form-section">

            <h2>Issuer Details</h2>

            <p class="small-text">
                These details are automatically added
                from the issuer's profile.
            </p>


            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Institute Name
                    </label>

                    <input
                        type="text"
                        value="{{ issuer.institute }}"
                        readonly>

                </div>


                <div class="form-group">

                    <label>
                        Issuer Name
                    </label>

                    <input
                        type="text"
                        value="{{ issuer.name }}"
                        readonly>

                </div>


                <div class="form-group">

                    <label>
                        Issuer Email
                    </label>

                    <input
                        type="email"
                        value="{{ issuer.email }}"
                        readonly>

                </div>

            </div>

        </div>


        <!-- Create -->

        <button
            type="submit"
            class="submit-btn">

            Create Certificate

        </button>


    </form>

</div>

</body>

</html>
