<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="student-login-card">

        <div class="student-login-header">

            <h1>Student Login</h1>

            <p>
                Enter your details to view your certificates.
            </p>

        </div>


        {% if error %}

            <div class="login-error">

                {{ error }}

            </div>

        {% endif %}


        <form method="POST">

            <!-- Student Name -->

            <div class="form-group">

                <label for="student_name">
                    Student Name
                </label>

                <input
                    type="text"
                    id="student_name"
                    name="student_name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <!-- Student Email -->

            <div class="form-group">

                <label for="student_email">
                    Student Email
                </label>

                <input
                    type="email"
                    id="student_email"
                    name="student_email"
                    placeholder="Enter your email address"
                    required>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="student-login-submit">

                Login & View Certificates

            </button>

        </form>


        <a
            href="{{ url_for('issuer_dashboard') }}"
            class="back-to-dashboard">

            ← Back to Issuer Dashboard

        </a>

    </div>

</div>

</body>

</html>
